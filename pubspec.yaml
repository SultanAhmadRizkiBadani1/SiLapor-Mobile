name: silapor_app
description: Aplikasi Deteksi Kerusakan Jalan berbasis AI + GIS

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 🌐 API
  http: ^1.2.0

  # 📸 CAMERA / IMAGE
  image_picker: ^1.1.2

  shared_preferences: ^2.2.2

  # 🗺️ MAP
  flutter_map: ^8.2.2
  latlong2: ^0.9.0
  flutter_map_marker_cluster: ^8.2.2

  # 📍 GPS (FIX STABIL)
  geolocator: ^14.0.2

  # 📊 CHART (COMPATIBLE)
  fl_chart: ^1.1.1

  # 🎨 UI
  cupertino_icons: ^1.0.6

  # 🚀 SPLASH & ICON
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/logo putih.png

# 🔥 APP ICON
flutter_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"

# 🔥 SPLASH SCREEN
flutter_native_splash:
  color: "#1E88E5"
  image: assets/logo.png
  android: true
  ios: false